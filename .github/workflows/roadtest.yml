name: Roadtest and publish evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: [main]
    paths:
      - "configs/**"
      - "contracts/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "public/**"
      - "package*.json"
      - "requirements-test.txt"
      - ".github/workflows/roadtest.yml"

permissions:
  contents: read

concurrency:
  group: roadtest-main
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: genvm-lint check contracts/OnboardingRoadtest.py --json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-runners-v0.3.0-rc7
      - name: Provide renamed GenVM runner archive to direct mode
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          if [ ! -f "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz" ]; then
            curl -fL --retry 3 --retry-delay 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              -o "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          fi
      - run: python -m pytest tests/direct -q
  roadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the independent site release
        run: |
          for i in $(seq 1 60); do
            if node -e 'const a=await fetch("https://reviewer-roadtest.vercel.app/openapi.json",{cache:"no-store"}).then(r=>r.json());const b=await fetch("https://reviewer-roadtest.vercel.app/roadtest.template.json",{cache:"no-store"}).then(r=>r.json());if(a.info.version!=="0.2.2"||b.id!=="my-project")process.exit(1)' ; then
              exit 0
            fi
            sleep 5
          done
          echo "The updated public site did not become available" >&2
          exit 1
      - name: Test Roadtest and write the report
        id: live
        continue-on-error: true
        run: npm run roadtest
      - run: npm test
      - name: Check the report website
        run: |
          node scripts/serve-public.mjs > /tmp/roadtest-serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/site.mjs
      - name: Commit the dated report, including failures
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -f public/reports/roadtest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- public/reports/roadtest.json public/evidence
            if ! git diff --cached --quiet; then
              git commit -m "ci: publish Roadtest evidence"
              git push
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadtest-evidence
          path: |
            public/reports/roadtest.json
            public/evidence/roadtest-first-visit.png
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Mark a failed live run as failed CI
        if: steps.live.outcome == 'failure'
        run: exit 1
